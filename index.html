<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Shelf — seven volumes</title>
<meta name="description" content="An interactive bookshelf: seven volumes plus one small book, each one you can pull from the shelf and open.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">

    <header class="masthead">
      <div>
        <h1 class="masthead__title">The Shelf<span class="masthead__ja">本棚</span></h1>
        <p class="masthead__sub" id="subtitle">seven volumes, one shelf — a quiet archive</p>
      </div>
      <span class="hanko" aria-hidden="true">本</span>
    </header>

    <main class="stage" id="stage" aria-label="A shelf of books">
      <div class="burst" id="burst" aria-hidden="true"></div>
      <div class="scene" id="scene">
        <div class="shelf-world" id="shelfWorld">
          <div class="shelf-plank" aria-hidden="true"></div>
          <div class="shelf-books" id="books"></div>
          <div class="bookend" aria-hidden="true"></div>
        </div>
      </div>
    </main>

    <footer class="hints" aria-label="How to use the shelf">
      <span class="hints__item"><kbd>Hover</kbd>&nbsp;to lift</span>
      <span class="hints__dot">·</span>
      <span class="hints__item"><kbd>Click</kbd>&nbsp;to pull</span>
      <span class="hints__dot">·</span>
      <span class="hints__item"><kbd>Click again</kbd>&nbsp;to open</span>
      <span class="hints__dot">·</span>
      <span class="hints__item"><kbd>Esc</kbd>&nbsp;to return</span>
    </footer>

    <div class="mobile-list" id="mobileList" aria-label="List of volumes"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
